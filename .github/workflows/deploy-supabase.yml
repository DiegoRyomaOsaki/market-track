name: Desplegar Supabase

#   dev  → market-track-staging
#   main → market-track (producción)
#
# El porqué de que nadie despliegue a mano está en SETUP.md → "Desplegar a la
# nube", junto al runbook de secretos.
#
# Solo en `push`: un pull request NO despliega. Su CI ya levanta un Postgres real
# y corre `db reset` con las migraciones enteras, así que la verificación ocurre
# antes de mergear; desplegar desde un PR abriría la nube a cualquier rama.
on:
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  # Nunca dos despliegues a la vez sobre el mismo entorno, y sin cancelar el que
  # está en marcha: una migración interrumpida a medias es peor que esperar.
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "22"

jobs:
  desplegar:
    name: ${{ github.ref_name == 'main' && 'Producción' || 'Staging' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # El entorno de GitHub es lo que permite exigir una aprobación manual antes
    # de tocar producción (Settings → Environments → required reviewers). El
    # workflow no puede imponerlo solo; esto es lo que lo hace posible.
    environment: ${{ github.ref_name == 'main' && 'produccion' || 'staging' }}

    env:
      # RELLENO, no un secreto — el mismo truco que `ci.yml`. El hook `send_sms`
      # (ADR-0008) hace que el CLI VALIDE el formato de este valor al leer
      # `config.toml`, y lo lee en cualquier comando: sin él, `migration list` y
      # `db push` mueren con "Invalid hook config" antes de conectarse a nada.
      #
      # Es seguro que sea falso porque este workflow NO ejecuta `supabase config
      # push`: la configuración de auth del proyecto remoto no se toca desde
      # aquí. ⚠️ Si algún día se añade `config push`, este valor de mentira
      # viajaría al proyecto real y rompería el envío de OTP — entonces tendría
      # que pasar a ser un secreto de verdad por entorno.
      SEND_SMS_HOOK_SECRET: v1,whsec_cmVsbGVuby1kZS1jaS1uby1lcy11bi1zZWNyZXRvLXJlYWw=
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Comprobar la contraseña de la base
        # Solo esta: un token o un ref mal puestos mueren en `link`, que es de
        # solo lectura y da un error claro. La contraseña la consume `db push`,
        # que sin ella se queda esperando en un prompt hasta agotar el timeout —
        # quince minutos para acabar sin saber por qué.
        run: |
          if [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::Falta SUPABASE_DB_PASSWORD en el entorno '${{ github.ref_name == 'main' && 'produccion' || 'staging' }}'. Ver SETUP.md → Desplegar a la nube."
            exit 1
          fi

      - name: Enlazar el proyecto
        run: pnpm exec supabase link --project-ref "$PROJECT_REF"

      - name: Deriva entre el repositorio y la nube
        # `db push` ya dice qué va a aplicar. Esto añade la otra mitad: qué hay en
        # la nube que no está en el repositorio, que es lo que delata un cambio
        # hecho a mano por el dashboard.
        run: pnpm exec supabase migration list --linked

      - name: Aplicar migraciones
        # `db push` nunca ejecuta seed.sql.
        #
        # `--include-all` porque sin él este paso se PLANTA —y con él el
        # despliegue entero— en cuanto una migración local ordena antes de la
        # última aplicada en la nube: "Found local migration files to be inserted
        # before the last migration on remote". No aplica ni esa ni ninguna de
        # las siguientes. Pasó el 14 ago 2026 y nadie miró el rojo: staging se
        # quedó seis migraciones por detrás, tres de ellas de seguridad.
        #
        # Lo que se acepta a cambio: una migración fuera de orden se aplica en
        # silencio, y si toca lo mismo que una posterior ya aplicada, la revierte.
        # Por eso el guardarraíl está en el CI de los PR (`verificar-migraciones`),
        # que es donde renumerar todavía es gratis — aquí ya está mergeada, y
        # renumerar algo que otro entorno ya aplicó es peor que aplicarlo tarde.
        run: pnpm exec supabase db push --linked --include-all

      - name: Desplegar Edge Functions
        # Sin nombres: el CLI despliega todas las de `supabase/functions/`. La
        # carpeta `_shared` no entra porque su nombre no es un slug válido.
        run: pnpm exec supabase functions deploy

      - name: Configuración del entorno cargada
        # Un no-op silencioso no se distingue de "no había alertas". El trigger
        # del email y el barrido de fotos hacen `return` cuando les falta la
        # configuración —a propósito: el trigger no puede romper la escritura del
        # sync, y en local no hay a quién llamar—, así que staging estuvo desde
        # que existe sin enviar un correo ni sellar una foto, en silencio.
        #
        # Va DESPUÉS de desplegar a propósito: el esquema y las funciones se
        # aplican igual. Lo que se pone rojo es esta comprobación, con el comando
        # exacto que falta por ejecutar.
        #
        # La primera vez que un entorno se despliega, ESTE PASO SALE ROJO y así
        # debe ser: es la lista de deberes de SETUP.md, no un fallo del pipeline.
        #
        # Solo viajan NOMBRES: `app.config_faltante()` no devuelve valores, así
        # que ningún secreto puede acabar escrito en el log de Actions.
        # `functions_url` sí se lee — es la URL pública del proyecto, y sin ella
        # no hay forma de comprobar que apunta a ESTE entorno y no al de al lado.
        run: |
          set -euo pipefail
          pnpm exec supabase db query --linked --output json \
            "select app.config_faltante() as faltan, app.config('functions_url') as functions_url" \
            > config-nube.json
          node scripts/verificar-config-nube.mjs "$PROJECT_REF" < config-nube.json
