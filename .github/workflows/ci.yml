name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

# Privilegio mínimo POR DEFECTO: solo leer el código. Cualquier job que necesite
# más tiene que pedirlo explícitamente, y entonces se ve en la revisión.
permissions:
  contents: read

concurrency:
  # Un push nuevo cancela la corrida vieja del mismo PR: nadie espera por un
  # resultado que ya no importa. En dev/main no se cancela: ahí sí queremos el
  # historial completo de qué commit pasó y cuál no.
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Las acciones de terceros van ancladas al SHA del commit, nunca a un tag.
# Un tag es MUTABLE: quien controle el repo de la acción puede reapuntar `v5` a
# código nuevo, y ese código corre con nuestro token. El SHA no se puede
# reescribir. El comentario `# vX` es solo para saber qué versión es al leerlo.
env:
  NODE_VERSION: "22"

jobs:
  verificar:
    name: Lint · tipos · tests · build · formato
    runs-on: ubuntu-latest
    # Se queda en 10. Medido con el build ya dentro y sin caché de turbo que
    # reutilizar: el job entero tarda 4 min, así que 10 da margen de sobra y un
    # timeout ajustado sigue sirviendo para lo que existe — cortar un cuelgue.
    timeout-minutes: 10

    env:
      # RELLENO, no secretos. Son `NEXT_PUBLIC_*`: por definición viajan dentro
      # del JavaScript que sirve el navegador, así que esconderlas aquí no
      # protegería nada — lo que protege los datos es la RLS. Están porque
      # `apps/web/src/lib/env.ts` valida el entorno al cargar y el build no
      # arranca sin ellas; los valores reales viven en Vercel.
      #
      # El build no habla con Supabase: ninguna página se prerrenderiza pidiéndole
      # datos. Si algún día una lo hiciera, este job se pondría rojo apuntando a
      # un host que no existe — que es la señal correcta, no un fallo del CI.
      #
      # `.invalid` es un TLD reservado (RFC 2606) que no resuelve en ninguna red.
      # Se prefiere a `127.0.0.1` a propósito: si alguien copia este bloque a un
      # paso que sí despliegue, un host que no resuelve falla a gritos, mientras
      # que `localhost` resolvería al propio runner y el fallo sería mudo.
      NEXT_PUBLIC_SUPABASE_URL: http://supabase.relleno-de-ci.invalid
      NEXT_PUBLIC_SUPABASE_ANON_KEY: relleno-de-ci-no-es-una-clave-real

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        # Sin `version:` a propósito: la lee de `packageManager` en package.json.
        # Fijarla aquí crearía una segunda fuente de verdad que se desincroniza.

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Migraciones sin duplicados ni desorden
        # Lo primero y en un segundo: una migración mal numerada no rompe ningún
        # test — rompe el DESPLIEGUE, y en silencio. `supabase db push` se planta
        # ante una que ordene antes de la última ya aplicada y deja de aplicar
        # TODAS las siguientes. Así estuvo staging seis migraciones por detrás
        # desde el 14 ago 2026, con tres arreglos de seguridad sin desplegar.
        #
        # En un PR se compara contra la rama base. En un push a dev/main no hay
        # base con la que comparar: solo se revisan nombres y duplicados.
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -n "$BASE_REF" ]; then
            git fetch --depth=1 origin "$BASE_REF"
            node scripts/verificar-migraciones.mjs FETCH_HEAD
          else
            node scripts/verificar-migraciones.mjs
          fi

      - run: pnpm install --frozen-lockfile

      - name: Caché de turbo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - run: pnpm turbo run lint typecheck test --cache-dir=.turbo

      - name: Tests de los scripts de la raíz
        # `scripts/` no es un workspace, así que `turbo run test` no lo ve. Aquí
        # vive la lógica del guardarraíl de migraciones, que sin tests sería otra
        # cosa que nadie sabe si funciona hasta que hace falta.
        run: pnpm test:scripts

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x

      - name: Tests de las Edge Functions (Deno)
        # La lógica pura de `supabase/functions/_shared/*.ts` (firmado de R2,
        # hash del pase, decisión de verificación de fotos…) tiene tests Deno que
        # hasta aquí solo corrían si alguien los lanzaba a mano — un test que
        # nadie ejecuta aparenta cobertura y no protege nada. Son puros: sin
        # base, sin red hacia fuera (los `--allow-*` son los que pide zod/aws4fetch
        # al cargar). El arnés de INVOCACIÓN de las funciones (serve + llamada)
        # sigue pendiente aparte.
        working-directory: supabase/functions
        run: deno task test

      - name: Build
        # El type checker NO enlaza el bundle: un módulo que resuelve para `tsc`
        # puede abortar el empaquetador igual. Pasó con una Server Action que
        # arrastró `read-excel-file` —y su `require('@aws-sdk/client-s3')`
        # perezoso— a la entrada de acción: lint, tipos y 65 archivos de test en
        # verde, y `next build` muerto. Sin este paso eso solo se ve en el deploy.
        run: pnpm turbo run build --cache-dir=.turbo

      - name: Formato
        # Separado y al final: que un espacio de más no tape un test roto.
        run: pnpm format:check

  aislamiento:
    name: Aislamiento multi-tenant (RLS)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Job aparte porque levanta un Postgres real en Docker: cuesta minutos, no
    # segundos. Corre EN PARALELO con `verificar` — no depende de él. Si esperase,
    # un error de lint retrasaría el único job que verifica que ningún cliente ve
    # los datos de otro, que es la promesa contractual del producto.
    env:
      # RELLENO, no un secreto. El hook `send_sms` (ADR-0008) hace que el CLI
      # VALIDE el formato de este valor al leer `config.toml`, así que sin él
      # fallan `start`, `db reset` y `db:types` por igual — y no corre ni un test.
      # Va a nivel de JOB, no de paso, precisamente por eso: cualquier comando del
      # CLI que se añada aquí lo necesita, y ponerlo por paso ya se olvidó una vez.
      # En ESTE job el hook nunca se invoca: el `edge-runtime` está excluido en
      # `start` y ningún test de aislamiento hace login. Por eso puede estar a la
      # vista — no protege nada. (El job `sync` sí lo invoca: allí el harness hace
      # login con 2FA real, y por eso arranca con `edge-runtime`.) El secreto de
      # verdad vive en el `.env` de cada quien y en los secretos del proyecto.
      SEND_SMS_HOOK_SECRET: v1,whsec_cmVsbGVuby1kZS1jaS1uby1lcy11bi1zZWNyZXRvLXJlYWw=

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Levantar Supabase local
        # `pnpm exec`, NO la acción `supabase/setup-cli`: el CLI ya es una
        # devDependency fijada en el lockfile. La acción instalaría una segunda
        # versión distinta, y CI acabaría probando con un CLI que ningún
        # desarrollador tiene. Una sola versión, la del lockfile.
        #
        # Solo db y auth: no hacen falta Studio, Realtime ni Storage para probar
        # las políticas, y arrancarlos son minutos de CI regalados.
        run: pnpm exec supabase start -x studio,realtime,storage-api,imgproxy,edge-runtime,logflare,vector,supavisor

      - name: Aplicar migraciones y seed
        # `db reset` es lo que garantiza que las políticas probadas son las de las
        # MIGRACIONES, no las de un estado acumulado a mano.
        run: pnpm exec supabase db reset

      - name: Tests de aislamiento
        run: pnpm turbo run test:db --cache-dir=.turbo

      - name: Los tipos generados no se han quedado atrás
        # Una migración que cambia el esquema sin regenerar los tipos deja a
        # TypeScript mintiendo: compila en verde contra columnas que ya no existen.
        # Aquí se detecta; en runtime, no.
        run: |
          pnpm db:types
          if ! git diff --quiet -- packages/db/src/database.types.ts; then
            echo "::error file=packages/db/src/database.types.ts::Los tipos no coinciden con las migraciones. Corre 'pnpm db:types' y commitea el resultado."
            git --no-pager diff -- packages/db/src/database.types.ts
            exit 1
          fi

  sync:
    name: Aislamiento de la bajada (PowerSync)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # La OTRA superficie de seguridad del producto. `aislamiento` prueba lo que la
    # RLS deja LEER; esto prueba lo que el teléfono se DESCARGA, que no pasa por la
    # RLS en absoluto: PowerSync replica con un rol BYPASSRLS y lo que baja lo
    # deciden solo las sync rules. Un harness que solo pruebe RLS da un falso verde
    # para el móvil.
    #
    # Job aparte, y en paralelo, por tres razones: necesita `edge-runtime` (que
    # `aislamiento` excluye a propósito), necesita Mongo y PowerSync (que aquel no),
    # y fundirlos haría que un fallo de RLS y uno de sincronización compartieran un
    # solo check rojo — hoy el listado distingue «ningún cliente ve los datos de
    # otro» de «ningún teléfono se los descarga», y esa distinción vale.
    env:
      # Mismo relleno que el job de aislamiento, y por el mismo motivo: el CLI
      # valida su FORMATO al leer `config.toml`, así que sin él no arranca nada.
      SEND_SMS_HOOK_SECRET: v1,whsec_cmVsbGVuby1kZS1jaS1uby1lcy11bi1zZWNyZXRvLXJlYWw=
      # A diferencia de `aislamiento`, aquí el hook SÍ se invoca: el harness hace
      # login con 2FA de verdad. Sin proveedor de correo en CI, `enviar-otp`
      # devolvería 500 y ningún test podría autenticarse. En dry-run responde 200 y
      # deja el código en su log; el harness lo lee de `auth.mfa_challenges`, no del
      # correo. El OTP acaba en el log del runner: son usuarios de juguete de un
      # Supabase efímero.
      # Con prefijo de proyecto: `OTP_DRY_RUN` a secas es tan genérico que
      # alguien podría tenerlo exportado por otra herramienta y encender el
      # dry-run sin pedirlo.
      MT_OTP_DRY_RUN: "true"

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Levantar Supabase local
        # CON `edge-runtime`, a diferencia del job de aislamiento: ahí está el hook
        # que entrega el OTP, y sin él el harness no consigue una sesión aal2 — que
        # es exactamente lo que las sync rules exigen para bajar una sola fila.
        run: pnpm exec supabase start -x studio,realtime,storage-api,imgproxy,logflare,vector,supavisor

      - name: Aplicar migraciones y seed
        run: pnpm exec supabase db reset

      - name: Levantar PowerSync
        # El rol de replicación y la publicación los deja el preflight del harness,
        # que es quien sabe repararlos — y hace falta DESPUÉS de cada `db reset`,
        # porque el reset se lleva la publicación por delante.
        run: pnpm --filter @market-track/sync sync:up

      - name: Harness de aislamiento de la bajada
        # `supabase status -o env` exporta ANON_KEY con ese nombre exacto: la clave
        # sale del proyecto efímero, no de un valor pegado a mano que se desincroniza.
        run: |
          eval "$(pnpm exec supabase status -o env)"
          ANON_KEY="$ANON_KEY" pnpm turbo run test:sync --cache-dir=.turbo

      - name: Logs de PowerSync si algo falló
        # Sin esto, un fallo de replicación llega a GitHub como «bajaron 0 filas» y
        # no hay forma de saber por qué desde aquí.
        if: failure()
        run: docker compose -f packages/sync/config/docker-compose.yaml logs --tail=200
