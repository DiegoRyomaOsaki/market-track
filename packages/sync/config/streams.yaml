# Reglas de sincronización del móvil — Sync Streams, edición 3 (ADR-0001).
#
# Esto decide QUÉ se descarga al teléfono, y es una superficie de seguridad
# APARTE de la RLS: PowerSync replica con un rol BYPASSRLS, así que la bajada NO
# pasa por las políticas de Postgres. Un harness que solo pruebe RLS da un falso
# verde para el móvil (ver test/aislamiento.sync.test.ts).
#
# Formato: edición 3. Las "sync rules" legacy (con bucket_definitions y la
# función de usuario legacy) están obsoletas; en edición 3 se usa `auth.user_id()`.
# Verificado a la fuerza en el prototipo de MAR-17: la función legacy se rechaza
# con "Invalid schema in function name".

config:
  edition: 3

streams:
  # UN solo stream para el mercaderista. El acceso vive en el CTE `mi_tenant`:
  # devuelve el tenant del usuario SOLO si sigue teniendo acceso efectivo —él
  # activo, su cliente activo— Y su sesión llegó a aal2. Si algo de eso falla, el
  # CTE no devuelve nada y NO se replica ni una fila. Un solo dueño de la regla,
  # como `app.perfil_efectivo()` lo es para la RLS.
  mercaderista:
    auto_subscribe: true
    with:
      mi_tenant: |
        SELECT p.tenant_id AS tenant_id
        FROM profile p
        JOIN tenant t ON t.id = p.tenant_id
        WHERE p.id = auth.user_id()
          AND p.activo = true
          AND t.activo = true
          AND auth.parameter('aal') = 'aal2'
    queries:
      # El maestro comercial con el que trabaja: solo el de su cliente.
      - SELECT * FROM cadena WHERE tenant_id IN (SELECT tenant_id FROM mi_tenant)
      - SELECT * FROM tienda WHERE tenant_id IN (SELECT tenant_id FROM mi_tenant)
      - SELECT * FROM marca WHERE tenant_id IN (SELECT tenant_id FROM mi_tenant)
      - SELECT * FROM sku WHERE tenant_id IN (SELECT tenant_id FROM mi_tenant)
      - SELECT * FROM tienda_sku WHERE tenant_id IN (SELECT tenant_id FROM mi_tenant)
      - SELECT * FROM precio_regular WHERE tenant_id IN (SELECT tenant_id FROM mi_tenant)
      - SELECT * FROM promocion WHERE tenant_id IN (SELECT tenant_id FROM mi_tenant)

      # Su perfil y su rutero personal.
      #
      # El rutero se acota además por ESTADO: un borrador es la planeación a
      # medio hacer del supervisor —tiendas sin decidir, orden sin cerrar— y no
      # tiene por qué estar en el teléfono de nadie. `<> 'borrador'` y no
      # `= 'publicado'` a propósito: en cuanto el mercaderista empieza su día el
      # rutero pasa a `en_curso`, y filtrar por publicado se lo borraría del
      # bolsillo a media jornada.
      #
      # Y las paradas se acotan al rutero propio, no solo al tenant: si no, cada
      # mercaderista se descarga la planeación de todos sus compañeros.
      - SELECT * FROM profile WHERE id = auth.user_id()
      - SELECT * FROM rutero WHERE tenant_id IN (SELECT tenant_id FROM mi_tenant) AND mercaderista_id = auth.user_id() AND estado <> 'borrador'
      - SELECT * FROM rutero_parada WHERE tenant_id IN (SELECT tenant_id FROM mi_tenant) AND rutero_id IN (SELECT id FROM rutero WHERE mercaderista_id = auth.user_id() AND estado <> 'borrador')
      # Y cuando una parada SE VA, la baja tiene que llegar CON su explicación.
      # PowerSync borra la fila de la réplica sin decir nada, y lo que el
      # mercaderista concluye de una tienda que se le esfuma de la lista no es
      # "me la quitaron": es que la app se equivocó. Esta tabla es
      # solo-inserción y la escribe `quitar_parada_rutero` en la MISMA
      # transacción que el `delete`, así que la baja y su motivo llegan al
      # teléfono en el mismo checkpoint — no hay ventana en la que la parada ya
      # no esté y el aviso todavía no.
      #
      # `estado_rutero <> 'borrador'`, igual que las dos líneas de arriba: una
      # parada quitada de un borrador NUNCA estuvo en este teléfono, y anunciar
      # su pérdida sería inventarla.
      #
      # Columnas EXPLÍCITAS, no `SELECT *`: `retirada_por` NO baja. Es el id de
      # un perfil ajeno y este stream solo replica el propio; enseñar quién la
      # quitó exigiría abrir una superficie de sincronización de perfiles
      # ajenos que ningún criterio pide.
      - SELECT id, tenant_id, fecha, tienda_id, retirada_at, motivo FROM rutero_parada_retirada WHERE tenant_id IN (SELECT tenant_id FROM mi_tenant) AND mercaderista_id = auth.user_id() AND estado_rutero <> 'borrador'

      # Su trabajo de campo: TODO acotado a las visitas PROPIAS, no solo al
      # tenant. La RLS no interviene en la bajada: lo que aquí no se acote llega
      # al teléfono de cada compañero y sobrevive al robo del dispositivo. Lo que
      # cuelga del levantamiento (skus, respuestas, exhibiciones) se acota por el
      # levantamiento de una visita propia; la contingencia, por su visita.
      - SELECT * FROM visita WHERE tenant_id IN (SELECT tenant_id FROM mi_tenant) AND mercaderista_id = auth.user_id()
      # El resultado de la revisión de SUS reportes: la app le enseña la decisión
      # y, si le rechazaron uno, el motivo. Sin esta regla el criterio "el
      # mercaderista lo ve" no se cumple — la RLS no interviene en la bajada.
      # Acotada por las visitas propias, igual que las paradas por su rutero.
      - SELECT * FROM revision_visita WHERE tenant_id IN (SELECT tenant_id FROM mi_tenant) AND visita_id IN (SELECT id FROM visita WHERE mercaderista_id = auth.user_id())
      - SELECT * FROM levantamiento WHERE tenant_id IN (SELECT tenant_id FROM mi_tenant) AND visita_id IN (SELECT id FROM visita WHERE mercaderista_id = auth.user_id())
      - SELECT * FROM levantamiento_sku WHERE tenant_id IN (SELECT tenant_id FROM mi_tenant) AND levantamiento_id IN (SELECT id FROM levantamiento WHERE visita_id IN (SELECT id FROM visita WHERE mercaderista_id = auth.user_id()))
      # Los módulos que el mercaderista ya dio por terminados. La app los ESCRIBE
      # y los relee: son la mitad del avance del menú de visita —la otra es
      # `contingencia`— y sin ellos saltar de módulo perdería el progreso.
      # Acotados por el levantamiento de una visita propia, igual que los skus.
      - SELECT * FROM levantamiento_paso WHERE tenant_id IN (SELECT tenant_id FROM mi_tenant) AND levantamiento_id IN (SELECT id FROM levantamiento WHERE visita_id IN (SELECT id FROM visita WHERE mercaderista_id = auth.user_id()))
      # Respuestas de los campos libres del formulario configurable (ADR-0010): la
      # app las ESCRIBE y las relee para hidratar los pasos configurables al
      # reanudar. Solo las de SUS levantamientos: es lo que cada compañero
      # responde en el formulario, no un maestro compartido.
      - SELECT * FROM levantamiento_respuesta WHERE tenant_id IN (SELECT tenant_id FROM mi_tenant) AND levantamiento_id IN (SELECT id FROM levantamiento WHERE visita_id IN (SELECT id FROM visita WHERE mercaderista_id = auth.user_id()))
      # Las respuestas del checklist de check-in (MAR-98): la app las ESCRIBE y
      # las relee. Acotadas a las visitas PROPIAS, igual que `foto`: sin ese IN,
      # cada teléfono bajaría el checklist de todos sus compañeros.
      - SELECT * FROM visita_respuesta WHERE tenant_id IN (SELECT tenant_id FROM mi_tenant) AND visita_id IN (SELECT id FROM visita WHERE mercaderista_id = auth.user_id())
      # Exhibiciones negociadas: pre-carga que el mercaderista audita (solo lee),
      # maestro del cliente entero. La exhibición auditada cuelga del
      # levantamiento (la app la ESCRIBE y la relee): solo las de los suyos.
      - SELECT * FROM exhibicion_negociada WHERE tenant_id IN (SELECT tenant_id FROM mi_tenant)
      - SELECT * FROM exhibicion WHERE tenant_id IN (SELECT tenant_id FROM mi_tenant) AND levantamiento_id IN (SELECT id FROM levantamiento WHERE visita_id IN (SELECT id FROM visita WHERE mercaderista_id = auth.user_id()))
      # La metadata de SUS fotos. El binario va por la cola de disco a R2; aquí
      # solo viaja la fila. Se acota a las visitas propias, igual que la revisión:
      # sin ese IN, cada teléfono bajaría la evidencia de todos sus compañeros.
      - SELECT * FROM foto WHERE tenant_id IN (SELECT tenant_id FROM mi_tenant) AND visita_id IN (SELECT id FROM visita WHERE mercaderista_id = auth.user_id())
      # La contingencia (bypass) cuelga de la visita: solo las de las PROPIAS. La
      # app la ESCRIBE (el trigger de MAR-28 dispara la alerta al supervisor) y
      # la relee para mostrar los pasos "⚠ Omitido".
      - SELECT * FROM contingencia WHERE tenant_id IN (SELECT tenant_id FROM mi_tenant) AND visita_id IN (SELECT id FROM visita WHERE mercaderista_id = auth.user_id())
      # Las incidencias de SUS visitas: la lista global que tiene que atender
      # antes de salir, venga del módulo que venga. La app las LEE (no las crea:
      # `authenticated` no tiene INSERT) y les escribe la resolución.
      #
      # Acotada por las visitas propias, igual que la contingencia y la foto. La
      # RLS no interviene en la bajada —PowerSync replica con un rol BYPASSRLS—,
      # así que lo que aquí no se acote llega al teléfono de cada compañero y
      # sobrevive al robo del dispositivo.
      #
      # `SELECT *` y no una proyección: cada columna de esta tabla es para el
      # mercaderista. No hay aquí un monto de bono ni un contador de operación
      # que dejar fuera.
      - SELECT * FROM incidencia WHERE tenant_id IN (SELECT tenant_id FROM mi_tenant) AND visita_id IN (SELECT id FROM visita WHERE mercaderista_id = auth.user_id())
      # Lo que el mercaderista declaró haber hecho con un hallazgo (ADR-0012). La
      # ESCRIBE la app y la relee para saber qué ya atendió: sin ella, una visita
      # hecha sin señal pierde la atención al sincronizar. Acotada al dueño de la
      # visita, igual que la incidencia.
      - SELECT * FROM atencion_hallazgo WHERE tenant_id IN (SELECT tenant_id FROM mi_tenant) AND visita_id IN (SELECT id FROM visita WHERE mercaderista_id = auth.user_id())
      # Solicitudes de cambio de ruta: la app las ESCRIBE y las relee para mostrar
      # su estado. Solo las PROPIAS (acotadas al usuario, no por parámetro del
      # cliente): la RLS deja al staff verlas todas, pero al teléfono solo bajan
      # las suyas.
      - SELECT * FROM solicitud_cambio_ruta WHERE tenant_id IN (SELECT tenant_id FROM mi_tenant) AND mercaderista_id = auth.user_id()
      # El formulario configurable del levantamiento (ADR-0010): el móvil baja el
      # formulario ACTIVO de su cliente y solo su versión PUBLICADA (la que
      # renderiza el wizard). Las versiones borrador no salen del panel.
      - SELECT * FROM formulario_levantamiento WHERE tenant_id IN (SELECT tenant_id FROM mi_tenant) AND activo = true
      - SELECT * FROM formulario_version WHERE tenant_id IN (SELECT tenant_id FROM mi_tenant) AND publicada = true

      # Su plan de lealtad: SOLO la fila propia. El cliente lo decidió en la
      # reunión del 3 ago 2026 —"que tú veas tu puntaje y tu posición, tú solo"—
      # y esa decisión se cumple AQUÍ, no en la RLS: PowerSync replica con un rol
      # BYPASSRLS, así que lo que no se acote en esta línea llega al teléfono de
      # cada compañero y sobrevive al robo del dispositivo.
      #
      # La POSICIÓN viaja guardada. El teléfono tiene una fila y no puede
      # calcular un rango; recalcularla aquí dejaría que el panel dijese "2.º" y
      # el móvil "3.º" del mismo periodo, y de ese número sale un bono. La
      # calcula `app.posicionar_merchandiser` sobre el cliente entero.
      #
      # Sin cota de fecha, como `visita`: son ~12 filas al año por persona y son
      # la fuente de la evolución que la pantalla dibuja.
      #
      # Columnas EXPLÍCITAS y no `SELECT *`, a propósito. `nivel_bono_id` apunta
      # a la escalera de bonos: el monto no se le baja al teléfono, el ticket no
      # lo pide, y un id suelto sin su escalera no resuelve a nada. `config_id`,
      # `cierre_bloqueado` y los contadores de salud del pipeline de fotos son
      # de operación, no del mercaderista. `tiempo_efectivo_pct` es siempre NULL.
      - SELECT id, mercaderista_id, tenant_id, tipo, periodo_inicio, total_pct, puntualidad_pct, asistencia_pct, calidad_pct, herramientas_pct, posicion, mercaderistas_evaluados, hay_empate, paradas_evaluables, paradas_asistidas, paradas_con_hora, paradas_puntuales, campos_obligatorios, campos_respondidos, fotos_esperadas, fotos_presentes, items_checklist, items_cumplidos, calculado_at, cerrado_at FROM puntaje_merchandiser WHERE tenant_id IN (SELECT tenant_id FROM mi_tenant) AND mercaderista_id = auth.user_id()

      # El Perfect Store de SUS levantamientos: es lo que deja a "Mi día" decir
      # "la última vez esta tienda quedó en 78". Acotado por el levantamiento de
      # una visita propia, igual que `levantamiento_sku` y `exhibicion`.
      #
      # `levantamiento_id AS id` porque la clave primaria de esta tabla ES el
      # levantamiento (1:1) y PowerSync identifica cada fila por `id`.
      - SELECT levantamiento_id AS id, tenant_id, levantamiento_id, total_pct, calculado_at FROM puntaje_perfect_store WHERE tenant_id IN (SELECT tenant_id FROM mi_tenant) AND levantamiento_id IN (SELECT id FROM levantamiento WHERE visita_id IN (SELECT id FROM visita WHERE mercaderista_id = auth.user_id()))

      # La PERIODICIDAD del plan, y solo eso: sin ella el móvil tendría que
      # adivinar qué `tipo` mirar cuando conviven filas mensuales y anuales —el
      # 1 de enero es inicio de las tres—, y esa heurística es exactamente el
      # "el panel dice T3 y el móvil dice enero" que este stream viene a evitar.
      # Los PESOS no bajan: son la política laboral del cliente, no del teléfono.
      - SELECT id, tenant_id, periodicidad, vigente_desde FROM config_perfect_merchandiser WHERE tenant_id IN (SELECT tenant_id FROM mi_tenant)
